[project]
name = "jobtracker"
version = "1.2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings",
    "sqlalchemy>=2",
    "alembic",
    "apscheduler>=3.10,<4",
    "pebble",
    "httpx",
    "packaging",
    "python-multipart",
    "anthropic==2.1.0",
    "openai==3.37.0",
    "httpx2==2.16.0",
    "pypdf==6.21.2",  # local PDF text extraction
    "pypdfium2==5.14.0",  # renders scanned PDF pages for LLM transcription
    "pillow==13.0.0",  # PNG/JPEG encoding and downscaling
    "openpyxl==3.1.5",  # CSV/XLSX export of applications
    "python-jobspy==1.4.1",  # LinkedIn, Indeed, Glassdoor, ... (JobSpy plugins)
    "tzdata",  # zoneinfo data on Windows (Europe/Berlin day boundary)
]

[project.optional-dependencies]
dev = ["pytest", "respx"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live: tests hitting real external services (deselected by default)",
  "tectonic: tests that need the tectonic executable",
]
addopts = "-m 'not live'"
